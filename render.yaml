services:
  - type: web
    name: cassava-guard-api
    # Plain python env: onnxruntime installs from PyPI, no custom index needed.
    env: python
    plan: free
    buildCommand: pip install -r requirements_api.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CASSAVA_MODEL_PATH
        value: ./cassava_customcnn.int8.onnx
      - key: CASSAVA_MIN_CONFIDENCE
        value: "0.40"
      # onnxruntime spawns threads per core; pin to 1 to stay inside 512 MB.
      - key: CASSAVA_ORT_THREADS
        value: "1"
